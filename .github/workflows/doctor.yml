name: doctor

# Minimal CI: runs the hermetic doctor.sh regression suite on every push/PR.
# The suite needs only bash + node and touches nothing outside 127.0.0.1.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Run doctor.sh regression tests
        run: bash scripts/doctor.test.sh
